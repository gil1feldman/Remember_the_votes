<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>תוצאות הצבעה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0b0f1a;
  --surface:   #111827;
  --surface2:  #1a2235;
  --border:    rgba(255,255,255,0.07);
  --for:       #22c55e;
  --for-dim:   rgba(34,197,94,0.12);
  --for-glow:  rgba(34,197,94,0.3);
  --against:   #f43f5e;
  --against-dim: rgba(244,63,94,0.12);
  --against-glow: rgba(244,63,94,0.3);
  --abstain:   #f59e0b;
  --abstain-dim: rgba(245,158,11,0.1);
  --text:      #f1f5f9;
  --muted:     #64748b;
  --cyan:      #38bdf8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'Heebo', Arial, sans-serif;
  direction: rtl;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE TEXTURE ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
}

#app { position: relative; z-index: 1; }

/* ── LOADING / ERROR ── */
.center-screen {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(56,189,248,0.15);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.load-label { color: var(--muted); font-size: 14px; font-weight: 500; }
.error-msg { color: #fb7185; font-size: 15px; max-width: 360px; line-height: 1.7; }

/* ── HEADER ── */
.page-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(56,189,248,0.04) 0%, transparent 100%);
}
.header-inner { max-width: 1100px; margin: 0 auto; }
.vote-label {
  font-size: 11px; letter-spacing: 4px; font-weight: 700;
  color: var(--cyan); text-transform: uppercase; margin-bottom: 8px;
}
.vote-title {
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 900; line-height: 1.2; margin-bottom: 12px;
}
.vote-meta {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.meta-pill {
  font-size: 12px; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; background: rgba(255,255,255,0.06);
  border: 1px solid var(--border); color: var(--muted);
}
.meta-pill.decision-pass { color: var(--for); border-color: rgba(34,197,94,0.3); background: var(--for-dim); }
.meta-pill.decision-fail { color: var(--against); border-color: rgba(244,63,94,0.3); background: var(--against-dim); }

/* ── SUMMARY BAR ── */
.summary-wrap {
  max-width: 1100px; margin: 20px auto 0; padding: 0 24px;
}
.summary-bar-outer {
  background: rgba(255,255,255,0.05);
  border-radius: 12px; overflow: hidden; height: 12px;
  display: flex; margin-bottom: 14px; gap: 2px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}
.bar-for     { background: var(--for);     transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1); }
.bar-against { background: var(--against); transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.1s; }
.bar-abstain { background: var(--abstain); transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s; }

.summary-counts {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.count-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 10px;
  font-size: 13px; font-weight: 700;
  border: 1px solid transparent;
}
.count-chip.for     { background: var(--for-dim);     border-color: rgba(34,197,94,0.25);  color: var(--for); }
.count-chip.against { background: var(--against-dim); border-color: rgba(244,63,94,0.25);  color: var(--against); }
.count-chip.abstain { background: var(--abstain-dim); border-color: rgba(245,158,11,0.25); color: var(--abstain); }
.count-num { font-size: 20px; font-weight: 900; font-family: monospace; }

/* ── MAIN GRID ── */
.main-grid {
  max-width: 1100px; margin: 20px auto; padding: 0 24px 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 700px) {
  .main-grid { grid-template-columns: 1fr; }
}

/* ── PANEL ── */
.panel {
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column;
  animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.panel.for-panel     { border-top: 3px solid var(--for);     box-shadow: 0 0 30px rgba(34,197,94,0.08); }
.panel.against-panel { border-top: 3px solid var(--against); box-shadow: 0 0 30px rgba(244,63,94,0.08); }
.panel.abstain-panel {
  grid-column: 1 / -1;
  border-top: 3px solid var(--abstain);
  box-shadow: 0 0 30px rgba(245,158,11,0.06);
}
@media (max-width: 700px) { .panel.abstain-panel { grid-column: 1; } }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.panel.for-panel     { animation-delay: 0.1s; }
.panel.against-panel { animation-delay: 0.2s; }
.panel.abstain-panel { animation-delay: 0.3s; }

.panel-header {
  padding: 14px 18px; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 800;
}
.panel-icon { font-size: 18px; }
.panel-count {
  font-size: 12px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; font-family: monospace;
}
.for-panel     .panel-title { color: var(--for); }
.against-panel .panel-title { color: var(--against); }
.abstain-panel .panel-title { color: var(--abstain); }
.for-panel     .panel-count { background: var(--for-dim);     color: var(--for); }
.against-panel .panel-count { background: var(--against-dim); color: var(--against); }
.abstain-panel .panel-count { background: var(--abstain-dim); color: var(--abstain); }

/* ── SEARCH ── */
.panel-search {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 12px; color: var(--text);
  font-family: inherit; font-size: 13px; outline: none;
  transition: border-color 0.2s;
  direction: rtl;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--cyan); }

/* ── FACTION GROUPS ── */
.factions-wrap { flex: 1; overflow-y: auto; padding: 10px; }
.factions-wrap::-webkit-scrollbar { width: 4px; }
.factions-wrap::-webkit-scrollbar-track { background: transparent; }
.factions-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

/* Abstain panel: grid of factions */
.abstain-panel .factions-wrap {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px; align-content: start;
}

.faction-group {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  margin-bottom: 8px;
}
.abstain-panel .faction-group { margin-bottom: 0; }

.faction-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; cursor: pointer;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
  user-select: none; transition: background 0.15s;
}
.faction-header:hover { background: rgba(255,255,255,0.06); }
.faction-name { font-size: 12px; font-weight: 700; color: var(--text); }
.faction-count-badge {
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; font-family: monospace; flex-shrink: 0;
}
.for-panel     .faction-count-badge { background: var(--for-dim);     color: var(--for); }
.against-panel .faction-count-badge { background: var(--against-dim); color: var(--against); }
.abstain-panel .faction-count-badge { background: var(--abstain-dim); color: var(--abstain); }

.faction-chevron { color: var(--muted); font-size: 10px; transition: transform 0.2s; flex-shrink: 0; margin-right: 6px; }
.faction-group.open .faction-chevron { transform: rotate(90deg); }

.members-list { display: none; padding: 6px 8px; gap: 4px; flex-direction: column; }
.faction-group.open .members-list { display: flex; }

.member-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 6px; border-radius: 7px;
  transition: background 0.12s;
}
.member-row:hover { background: rgba(255,255,255,0.05); }

.member-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
  border: 1px solid var(--border);
}
.member-avatar img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: top center;
}

.member-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }

/* ── HIDDEN BY SEARCH ── */
.member-row.hidden     { display: none; }
.faction-group.all-hidden { display: none; }

/* ── SWITCH VIEW ── */
.view-toggle {
  max-width: 1100px; margin: 0 auto; padding: 0 24px 4px;
  display: flex; gap: 8px;
}
.toggle-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--muted);
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.toggle-btn.active { background: rgba(56,189,248,0.12); border-color: var(--cyan); color: var(--cyan); }

/* ── FLAT NAME LIST (alternative view) ── */
.name-cloud {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 10px;
}
.name-tag {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 6px; cursor: default;
  transition: transform 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.name-tag:hover { transform: scale(1.05); }
.for-panel     .name-tag { background: var(--for-dim);     color: var(--for);     border: 1px solid rgba(34,197,94,0.2); }
.against-panel .name-tag { background: var(--against-dim); color: var(--against); border: 1px solid rgba(244,63,94,0.2); }
.abstain-panel .name-tag { background: var(--abstain-dim); color: var(--abstain); border: 1px solid rgba(245,158,11,0.2); }

.name-tag-avatar {
  width: 20px; height: 20px; border-radius: 50%;
  overflow: hidden; background: rgba(255,255,255,0.1);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--muted);
}
.name-tag-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

/* ── BACK LINK ── */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: var(--muted);
  text-decoration: none; padding: 6px 0;
  transition: color 0.15s;
}
.back-link:hover { color: var(--cyan); }
</style>
</head>
<body>
<div id="app">
  <div id="state-loading" class="center-screen">
    <div class="spinner"></div>
    <div class="load-label" id="load-msg">טוען נתוני הצבעה…</div>
  </div>
  <div id="state-error" class="center-screen" style="display:none">
    <div style="font-size:48px">⚠️</div>
    <div class="error-msg" id="error-msg"></div>
    <button onclick="location.reload()" style="margin-top:8px;padding:10px 24px;border-radius:10px;border:none;background:var(--cyan);color:#000;font-weight:800;cursor:pointer;font-family:inherit;">נסה שוב</button>
  </div>
  <div id="state-result" style="display:none">

    <div class="page-header">
      <div class="header-inner">
        <a href="javascript:history.back()" class="back-link">◄ חזרה</a>
        <div class="vote-label">תוצאות הצבעה</div>
        <div class="vote-title" id="vote-title">—</div>
        <div class="vote-meta" id="vote-meta"></div>
      </div>
    </div>

    <div class="summary-wrap">
      <div class="summary-bar-outer">
        <div class="bar-for"     id="bar-for"     style="width:0%"></div>
        <div class="bar-against" id="bar-against" style="width:0%"></div>
        <div class="bar-abstain" id="bar-abstain" style="width:0%"></div>
      </div>
      <div class="summary-counts" id="summary-counts"></div>
    </div>

    <div class="view-toggle" style="margin-top:16px">
      <button class="toggle-btn active" id="btn-faction" onclick="setView('faction')">לפי מפלגה</button>
      <button class="toggle-btn"        id="btn-names"   onclick="setView('names')">לפי שם</button>
    </div>

    <div class="main-grid" id="main-grid"></div>

  </div>
</div>

<script>
const params  = new URLSearchParams(window.location.search);
const VOTE_ID = params.get("vote") || "4138";

const API_BASES   = ["https://www.knesset.gov.il","https://knesset.gov.il","https://main.knesset.gov.il"];
const DETAIL_PATH = "/WebSiteApi/knessetapi/Votes/GetVoteDetails/";
const MK_PHOTO_BASE = "https://www.knesset.gov.il/mk/images/members/";

const sleep = ms => new Promise(r => setTimeout(r, ms));

function normalizeVote(title) {
  if (!title) return null;
  const t = title.trim();
  if (t === "בעד")  return "for";
  if (t === "נגד")  return "against";
  if (t === "נמנע" || t === "נמנע/נעדר" || t === "נעדר") return "abstain";
  return null;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function initials(name) {
  const parts = name.trim().split(" ");
  return parts.length >= 2 ? parts[0][0] + parts[1][0] : parts[0][0] || "?";
}

async function fetchVote() {
  for (const base of API_BASES) {
    try {
      const r = await fetch(base + DETAIL_PATH + VOTE_ID, { mode: "cors" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (data?.VoteDetails) return data;
    } catch (_) {}
    await sleep(200);
  }
  throw new Error(`לא ניתן לטעון הצבעה מספר ${VOTE_ID}`);
}

let currentView = "faction";
let allData = null;

function setView(v) {
  currentView = v;
  document.getElementById("btn-faction").classList.toggle("active", v === "faction");
  document.getElementById("btn-names").classList.toggle("active",   v === "names");
  renderPanels(allData);
}

function buildAvatarHTML(mk, size = 28) {
  // ניסיון לטעון תמונה מהכנסת לפי מספר ח"כ
  const mkId = mk.mkId;
  if (mkId) {
    return `<div class="member-avatar" style="width:${size}px;height:${size}px">
      <img src="${MK_PHOTO_BASE}${mkId}_sm.jpg"
           onerror="this.parentNode.innerHTML='${initials(mk.name)}'"
           alt="${esc(mk.name)}" />
    </div>`;
  }
  return `<div class="member-avatar" style="width:${size}px;height:${size}px">${initials(mk.name)}</div>`;
}

function groupByFaction(members) {
  const map = {};
  for (const m of members) {
    const f = m.faction || "לא ידוע";
    if (!map[f]) map[f] = [];
    map[f].push(m);
  }
  return Object.entries(map).sort((a, b) => b[1].length - a[1].length);
}

function renderFactionPanel(members, type, panelEl) {
  const groups = groupByFaction(members);
  let html = `<div class="panel-search">
    <input class="search-input" placeholder="חיפוש שם…" oninput="filterPanel(this,'${type}')" data-type="${type}" />
  </div>
  <div class="factions-wrap" id="factions-${type}">`;

  for (const [faction, mks] of groups) {
    const isOpen = mks.length >= 3 || groups.length <= 2;
    html += `<div class="faction-group${isOpen ? " open" : ""}" data-faction="${esc(faction)}">
      <div class="faction-header" onclick="toggleFaction(this.parentNode)">
        <span class="faction-name">${esc(faction)}</span>
        <span class="faction-chevron">▶</span>
        <span class="faction-count-badge">${mks.length}</span>
      </div>
      <div class="members-list">`;
    for (const mk of mks) {
      html += `<div class="member-row" data-name="${esc(mk.name)}">
        ${buildAvatarHTML(mk)}
        <span class="member-name">${esc(mk.name)}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function renderNamesPanel(members, type) {
  const sorted = [...members].sort((a, b) => a.name.localeCompare(b.name, "he"));
  let html = `<div class="panel-search">
    <input class="search-input" placeholder="חיפוש שם…" oninput="filterNameCloud(this,'${type}')" data-type="${type}" />
  </div>
  <div class="factions-wrap"><div class="name-cloud" id="cloud-${type}">`;
  for (const mk of sorted) {
    html += `<div class="name-tag" data-name="${esc(mk.name)}">
      ${buildAvatarHTML(mk, 20)}
      ${esc(mk.name)}
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

function renderPanels(data) {
  const grid = document.getElementById("main-grid");
  const panels = [
    { type: "for",     label: "בעד",  icon: "✓", members: data.for },
    { type: "against", label: "נגד",  icon: "✗", members: data.against },
    { type: "abstain", label: "נמנע", icon: "↕", members: data.abstain },
  ];

  grid.innerHTML = panels.filter(p => p.members.length > 0).map(p => {
    const inner = currentView === "faction"
      ? renderFactionPanel(p.members, p.type)
      : renderNamesPanel(p.members, p.type);

    return `<div class="panel ${p.type}-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-icon">${p.icon}</span>
          ${p.label}
        </div>
        <span class="panel-count">${p.members.length}</span>
      </div>
      ${inner}
    </div>`;
  }).join("");
}

function toggleFaction(el) {
  el.classList.toggle("open");
}

function filterPanel(input, type) {
  const q = input.value.trim().toLowerCase();
  const wrap = document.getElementById("factions-" + type);
  if (!wrap) return;
  wrap.querySelectorAll(".faction-group").forEach(group => {
    let visCount = 0;
    group.querySelectorAll(".member-row").forEach(row => {
      const name = row.dataset.name.toLowerCase();
      const match = !q || name.includes(q);
      row.classList.toggle("hidden", !match);
      if (match) visCount++;
    });
    group.classList.toggle("all-hidden", visCount === 0);
    if (q && visCount > 0) group.classList.add("open");
  });
}

function filterNameCloud(input, type) {
  const q = input.value.trim().toLowerCase();
  const cloud = document.getElementById("cloud-" + type);
  if (!cloud) return;
  cloud.querySelectorAll(".name-tag").forEach(tag => {
    const name = tag.dataset.name.toLowerCase();
    tag.classList.toggle("hidden", q && !name.includes(q));
  });
}

async function init() {
  document.getElementById("load-msg").textContent = "טוען נתוני הצבעה…";
  try {
    const raw    = await fetchVote();
    const header = raw.VoteHeader?.[0] || {};
    const title  = header.ItemTitle || header.SubjectName || header.VoteSubject || `הצבעה ${VOTE_ID}`;

    const grouped = { for: [], against: [], abstain: [] };
    for (const d of raw.VoteDetails || []) {
      const v = normalizeVote(d.Title);
      if (!v) continue;
      grouped[v].push({
        name:    (d.MkName    || "").trim(),
        faction: (d.FactionName || "").trim(),
        mkId:    d.MkId || null,
      });
    }

    allData = grouped;

    // כותרת
    document.title = title + " — תוצאות";
    document.getElementById("vote-title").textContent = title;

    // מטא
    const metaEl = document.getElementById("vote-meta");
    const decisionClass = header.Decision?.includes("לא") ? "decision-fail" : "decision-pass";
    metaEl.innerHTML = [
      header.VoteDateStr ? `<span class="meta-pill">📅 ${esc(header.VoteDateStr)}</span>` : "",
      header.Decision    ? `<span class="meta-pill ${decisionClass}">⚖️ ${esc(header.Decision)}</span>` : "",
      `<span class="meta-pill">🗳️ הצבעה מספר ${VOTE_ID}</span>`,
    ].join("");

    // סרגל סיכום
    const total = grouped.for.length + grouped.against.length + grouped.abstain.length;
    const pct = n => total ? (n / total * 100).toFixed(1) : 0;
    document.getElementById("bar-for").style.width     = pct(grouped.for.length)     + "%";
    document.getElementById("bar-against").style.width = pct(grouped.against.length) + "%";
    document.getElementById("bar-abstain").style.width = pct(grouped.abstain.length) + "%";

    document.getElementById("summary-counts").innerHTML = `
      <div class="count-chip for">
        <span class="count-num">${grouped.for.length}</span> בעד
        <span style="color:var(--muted);font-size:11px">(${pct(grouped.for.length)}%)</span>
      </div>
      <div class="count-chip against">
        <span class="count-num">${grouped.against.length}</span> נגד
        <span style="color:var(--muted);font-size:11px">(${pct(grouped.against.length)}%)</span>
      </div>
      ${grouped.abstain.length ? `<div class="count-chip abstain">
        <span class="count-num">${grouped.abstain.length}</span> נמנע
        <span style="color:var(--muted);font-size:11px">(${pct(grouped.abstain.length)}%)</span>
      </div>` : ""}`;

    renderPanels(grouped);

    document.getElementById("state-loading").style.display = "none";
    document.getElementById("state-result").style.display  = "block";

  } catch (e) {
    document.getElementById("error-msg").textContent = e.message;
    document.getElementById("state-loading").style.display = "none";
    document.getElementById("state-error").style.display   = "flex";
  }
}

init();
</script>
</body>
</html>
